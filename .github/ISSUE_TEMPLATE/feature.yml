name: Feature
description: Propose a new capability or a change to an existing one.
title: "feat: "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be built and why. Include the scope and anything explicitly out of scope.
      placeholder: The parser must reject numbers written in exponent notation.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that decide when this issue is done. Tests are written from this list.
      placeholder: |
        - [ ] A line with `1e3` as the price is skipped with a reason.
        - [ ] The message contains the line number and the field name.
        - [ ] `clean verify` is green.
    validations:
      required: true
