name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Unix-like runners use the shell wrapper script.
      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      # Windows runners use the batch wrapper script.
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}
          path: target/lab01-*.jar
          if-no-files-found: error
