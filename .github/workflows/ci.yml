name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository keyed on the hash of pom.xml.
          cache: maven

      # Unix-like runners use the shell wrapper script.
      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify -Dci.build.number=${{ github.run_number }}

      # Windows runners use the batch wrapper script.
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify "-Dci.build.number=${{ github.run_number }}"

      # Tests must write only into @TempDir, never into the project directory.
      - name: Check that the test run created no out/ directory
        shell: bash
        run: test ! -e out

      - name: Upload JaCoCo report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-build-${{ github.run_number }}
          path: target/lab01-*.jar
          if-no-files-found: error
